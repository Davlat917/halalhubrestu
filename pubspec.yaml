name: halalhub_restaurant
description: "A Halalhub Restaurant application."

publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  another_flushbar: ^1.12.32
  injectable: ^2.7.1+4
  logger: ^2.6.2
  flutter_bloc: ^9.1.1
  collection: ^1.19.1
  dio: ^5.9.1
  get_it: ^9.2.1
  hive: ^2.2.3
  rxdart: ^0.28.0
  hive_flutter: ^1.1.0
  flutter_svg: ^2.2.3
  auto_route: ^11.1.0
  easy_localization: ^3.0.8
  device_preview: ^1.3.1
  mask_text_input_formatter: ^2.9.0
  cached_network_image: ^3.4.1
  video_player: ^2.9.5
  video_thumbnail: ^0.5.6
  shimmer: ^3.0.0
  url_launcher: ^6.3.2
  image_picker: ^1.2.1
  share_plus: ^12.0.1
  app_links: ^7.0.0
  google_maps_flutter: ^2.13.1
  equatable: ^2.0.8
  pin_code_fields: ^9.3.0
  google_sign_in: ^7.2.0
  sign_in_with_apple: ^7.0.1
  firebase_core: ^4.6.0
  freezed_annotation: ^3.1.0
  json_annotation: ^4.11.0
  web_socket_channel: ^3.0.2
  firebase_messaging: ^16.2.0
  flutter_local_notifications: ^21.0.0
  change_app_package_name: ^1.5.0
  audioplayers: ^6.6.0
  connectivity_plus: ^7.1.1
  open_filex: ^4.7.0
  permission_handler: ^12.0.1
  geolocator: ^14.0.2

 
  

dev_dependencies:
  flutter_test:
    sdk: flutter
  
  build_runner: ^2.11.1
  freezed: ^3.2.2
  json_serializable: ^6.11.1
  flutter_gen_runner: ^5.12.0
  injectable_generator: ^2.12.0
  auto_route_generator: ^10.4.0
  lean_builder: ^0.1.6


  flutter_lints: ^6.0.0
  rename: ^3.1.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.6


flutter:
  uses-material-design: true

  # iPad / simsiz debugda LLDB uzoq kutganda ogohlantirishni kamaytirish.
  config:
    enable-lldb-debugging: false

  assets:
    - assets/icons/
    - assets/images/
    - assets/locales/
    - assets/fonts/
    - assets/sounds/

 
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter_18pt-Bold.ttf
          weight: 700
        - asset: assets/fonts/Inter_18pt-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter_18pt-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter_18pt-Regular.ttf
          weight: 400

  # inter 
  # medium - 500
  # regular - 400
  # semiBold - 600
  # bold - 700

flutter_native_splash:
  android: true
  ios: true
  color: "#0DA84A"
  image: assets/icon/splash_logo.png
  android_gravity: center
  ios_content_mode: center
  fullscreen: false
  android_12:
    image: assets/icon/splash_logo.png
    color: "#0DA84A"
    icon_background_color: "#0DA84A"

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icon/image.png
  remove_alpha_ios: true


flutter_gen:
  output: lib/gen/
  integrations:
    flutter_svg: true
