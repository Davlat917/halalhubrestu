name: halal_hub_resto
description: "A new Flutter project."
publish_to: "none" # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_inappwebview: ^6.1.5
  http: ^1.6.0
  firebase_core: ^4.2.0
  firebase_messaging: ^16.1.2
  flutter_local_notifications: ^21.0.0
  flutter_svg: ^2.2.4

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.5
  change_app_package_name: ^1.5.0

flutter_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon/app_icon.png" # 1024x1024
  adaptive_icon_foreground: "assets/icon/foreground_icon.png" #432x432
  adaptive_icon_background: "assets/icon/background_icon.png" #432x432
  # min_sdk_android: 21
  remove_alpha_ios: true
  # image_path_ios: "assets/icon/background_green.png"

flutter_native_splash:
  android: true
  ios: true
  color: "#FFFFFF"
  color_dark: "#000000"
  image: assets/icon/splash_small_icon.png # 640x640
  android_12:
    image: assets/icon/splash_small_icon.png
    color: "#FFFFFF"
    color_dark: "#000000"
  #   icon_background_color: "#0DA84A"

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icon/
    - assets/icons/


